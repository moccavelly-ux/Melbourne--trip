<html lang="en">
<head>

<title>Melbourne Trip</title>

<style>
:root{
  --ink:#1c2321;
  --ink-soft:#3a423e;
  --paper:#f1ede2;
  --paper-2:#e8e1cd;
  --card:#fbf9f3;
  --green:#2e4034;
  --green-light:#4f6657;
  --green-pale:#dfe6df;
  --rust:#a8622e;
  --rust-light:#c98356;
  --rust-pale:#f0ddc9;
  --line:#cbc3ab;
  --white:#ffffff;
  --red:#9c3b3b;
  --amber:#a67c26;
  --radius:16px;
  --shadow:0 1px 2px rgba(28,35,33,0.06), 0 4px 16px rgba(28,35,33,0.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:78px;
  min-height:100vh;
}
::selection{background:var(--rust-pale);}
h1,h2,h3,.display{font-family:'Fraunces',serif;letter-spacing:-0.01em;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;}
a{color:inherit;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, var(--paper) 80%, transparent);
  padding:18px 20px 10px;
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-badge{
  width:38px;height:38px;border-radius:10px;
  background:var(--green);color:var(--paper);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:600;font-size:17px;
  box-shadow:var(--shadow);
  flex-shrink:0;
}
.brand-text .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--green-light);font-weight:600;}
.brand-text .title{font-size:19px;font-weight:600;line-height:1.1;}
.search-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--ink);
}

/* ---------- Main container ---------- */
#app{padding:6px 20px 40px;max-width:640px;margin:0 auto;}

/* ---------- Cards ---------- */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}
.card-title{
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--green-light);font-weight:600;margin:0 0 10px;
  display:flex;align-items:center;justify-content:space-between;
}
.card-title .link{font-size:11px;letter-spacing:.04em;text-transform:none;color:var(--rust);cursor:pointer;font-weight:600;}

/* ---------- Hero / countdown ---------- */
.hero{
  background:var(--green);color:var(--paper);
  border-radius:20px;padding:22px 20px;margin-bottom:16px;
  position:relative;overflow:hidden;
  box-shadow:var(--shadow);
}
.hero::after{
  content:"";position:absolute;right:-30px;bottom:-40px;width:160px;height:160px;
  border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.08),transparent 70%);
}
.hero-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust-light);font-weight:600;}
.hero-count{font-family:'Fraunces',serif;font-size:42px;font-weight:600;line-height:1;margin:8px 0 2px;}
.hero-sub{font-size:13.5px;color:#d8ded9;}
.hero-meta{display:flex;gap:18px;margin-top:14px;font-size:12.5px;color:#cdd6cf;flex-wrap:wrap;}
.hero-meta b{color:var(--paper);font-weight:600;}

/* ---------- Quick access grid ---------- */
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.qbtn{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 6px;text-align:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.qbtn .ic{font-size:19px;}
.qbtn .lb{font-size:10.5px;font-weight:600;color:var(--ink-soft);letter-spacing:.01em;}

/* summary strip */
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.sumcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;}
.sumcard .n{font-family:'Fraunces',serif;font-size:20px;font-weight:600;}
.sumcard .l{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}

/* ---------- List rows ---------- */
.row{
  display:flex;align-items:flex-start;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none;}
.row-time{
  font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;
  color:var(--green);min-width:48px;padding-top:2px;
}
.row-main{flex:1;min-width:0;}
.row-title{font-weight:600;font-size:14.5px;}
.row-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}

.tag{
  font-size:10px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:20px;
  display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
}
.tag-must{background:var(--rust-pale);color:var(--rust);}
.tag-high{background:#fbe9d3;color:#95591c;}
.tag-opt{background:var(--green-pale);color:var(--green);}
.tag-if{background:#eee9dc;color:#8a8267;}
.tag-conf{background:var(--green-pale);color:var(--green);}
.tag-pending{background:#fbe9d3;color:#95591c;}
.tag-cancel{background:#f1dcdc;color:var(--red);}
.tag-action{background:#f1dcdc;color:var(--red);}

/* ---------- Buttons ---------- */
.btn{
  border:none;border-radius:12px;padding:12px 16px;font-weight:600;font-size:14px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn-primary{background:var(--green);color:var(--paper);width:100%;}
.btn-rust{background:var(--rust);color:#fff;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px;}
.btn-danger{background:transparent;color:var(--red);border:1px solid #e2c3c3;}
.btn:active{transform:scale(0.98);}
.btn-block{width:100%;}

/* ---------- Empty state ---------- */
.empty{
  text-align:center;padding:34px 18px;border:1.5px dashed var(--line);border-radius:16px;
  background:var(--card);
}
.empty .ic{font-size:26px;margin-bottom:8px;}
.empty h3{margin:0 0 6px;font-size:16px;}
.empty p{margin:0 0 16px;font-size:13px;color:var(--ink-soft);max-width:320px;margin-left:auto;margin-right:auto;}

/* ---------- Section headers ---------- */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;}
.sec-head h2{font-size:20px;margin:0;font-weight:600;}
.sec-sub{font-size:12.5px;color:var(--ink-soft);margin-top:-6px;margin-bottom:14px;}

/* ---------- Tabs (segmented) ---------- */
.segmented{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
.segmented::-webkit-scrollbar{display:none;}
.seg-btn{
  flex-shrink:0;padding:8px 14px;border-radius:20px;border:1px solid var(--line);
  background:var(--card);font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;
}
.seg-btn.active{background:var(--green);border-color:var(--green);color:var(--paper);}

/* ---------- Day / tram-line timeline (signature element) ---------- */
.day-card{margin-bottom:16px;}
.day-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;cursor:pointer;}
.day-badge{
  width:40px;height:40px;border-radius:50%;background:var(--green);color:var(--paper);
  display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;
  font-weight:600;font-size:13px;flex-shrink:0;
}
.day-head-text{flex:1;min-width:0;}
.day-head-text .d{font-size:11px;color:var(--ink-soft);font-weight:600;letter-spacing:.03em;}
.day-head-text .t{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
.day-chev{color:var(--ink-soft);font-size:13px;transition:transform .15s;}
.day-chev.open{transform:rotate(90deg);}

.tram-line{position:relative;padding-left:34px;margin-top:14px;}
.tram-line::before{
  content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;
  background:repeating-linear-gradient(var(--green-light),var(--green-light) 6px, transparent 6px, transparent 11px);
}
.stop{position:relative;padding-bottom:18px;}
.stop:last-child{padding-bottom:0;}
.stop::before{
  content:"";position:absolute;left:-34px;top:2px;width:11px;height:11px;border-radius:50%;
  background:var(--rust);border:2px solid var(--paper);box-shadow:0 0 0 1.5px var(--rust);
}
.stop.done::before{background:var(--green);box-shadow:0 0 0 1.5px var(--green);}
.stop-time{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--green);font-weight:600;}
.stop-title{font-weight:600;font-size:14.5px;margin-top:2px;}
.stop-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.stop-actions{display:flex;gap:8px;margin-top:8px;}
.stop-actions span{font-size:11.5px;color:var(--rust);font-weight:600;cursor:pointer;}

/* ---------- Modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(20,24,22,0.42);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .18s;
}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{
  background:var(--paper);width:100%;max-width:640px;max-height:88vh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:18px 20px 28px;
  transform:translateY(16px);transition:transform .18s;
  box-shadow:0 -8px 30px rgba(0,0,0,0.15);
}
.overlay.show .sheet{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sheet-head h3{margin:0;font-size:18px;}
.sheet-close{width:30px;height:30px;border-radius:50%;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:15px;color:var(--ink-soft);}

.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-size:14.5px;color:var(--ink);font-family:inherit;
}
.field textarea{resize:vertical;min-height:60px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.chip-select{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);
  font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);
}
.chip.sel{background:var(--green);border-color:var(--green);color:var(--paper);}

/* ---------- Bottom nav ---------- */
.bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 4px 14px;
  box-shadow:0 -2px 12px rgba(0,0,0,0.05);
}
.navbtn{
  background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-soft);cursor:pointer;padding:6px 4px;flex:1;
}
.navbtn .ic{font-size:19px;}
.navbtn .lb{font-size:10px;font-weight:600;}
.navbtn.active{color:var(--green);}

/* ---------- FAB ---------- */
.fab{
  position:fixed;right:18px;bottom:88px;z-index:60;
  width:56px;height:56px;border-radius:50%;background:var(--rust);color:#fff;
  border:none;font-size:26px;box-shadow:0 6px 18px rgba(168,98,46,0.4);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}

/* progress bar */
.progress{height:8px;border-radius:6px;background:var(--paper-2);overflow:hidden;margin-top:8px;}
.progress > div{height:100%;background:var(--green);border-radius:6px;transition:width .3s;}
.progress.rust > div{background:var(--rust);}

/* bar chart */
.barrow{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.barrow .lb{font-size:12px;color:var(--ink-soft);width:88px;flex-shrink:0;}
.barrow .track{flex:1;height:10px;background:var(--paper-2);border-radius:6px;overflow:hidden;}
.barrow .track>div{height:100%;background:var(--rust);border-radius:6px;}
.barrow .val{font-size:12px;font-family:'IBM Plex Mono',monospace;width:64px;text-align:right;flex-shrink:0;}

.copybtn{
  border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 10px;
  font-size:11.5px;font-weight:600;cursor:pointer;color:var(--green);display:inline-flex;gap:5px;align-items:center;
}
.demo-flag{
  font-size:10px;font-weight:700;background:var(--rust-pale);color:var(--rust);padding:2px 7px;border-radius:8px;margin-left:6px;
}
.muted{color:var(--ink-soft);}
.checkrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
.checkrow:last-child{border-bottom:none;}
.checkbox{
  width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;background:var(--card);
}
.checkbox.done{background:var(--green);border-color:var(--green);}
.checkrow-text{flex:1;font-size:14px;}
.checkrow-text.done{text-decoration:line-through;color:var(--ink-soft);}
.del-x{color:var(--ink-soft);cursor:pointer;font-size:15px;padding:4px;}
.toast{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;z-index:200;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s, top .2s;
}
.toast.show{opacity:1;top:22px;}
.hint{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.save-status{
  font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:6px 10px;border-radius:20px;cursor:pointer;
  white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--green-light);
  transition:background .15s,color .15s,border-color .15s;
}
.save-status.saving{color:var(--amber);border-color:#e6d4a8;background:#fbf6e8;}
.save-status.error{color:var(--red);border-color:#e2c3c3;background:#fbeaea;}
.storage-banner{
  background:#fbeaea;border:1px solid #e2c3c3;color:var(--red);border-radius:16px;
  padding:14px 16px;margin-bottom:14px;font-size:13px;line-height:1.5;
}
.storage-banner b{display:block;margin-bottom:4px;font-size:14px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <div class="brand-badge">M</div>
      <div class="brand-text">
        <div class="eyebrow">Family Trip</div>
        <div class="title">Melbourne</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="save-status" class="save-status" onclick="showStorageInfo()">✓ Saved</div>
      <button class="search-btn" onclick="openSearch()">⌕</button>
    </div>
  </div>
</div>

<div id="app"></div>

<button class="fab" onclick="openQuickAdd()">＋</button>

<div class="bottomnav">
  <button class="navbtn" data-tab="dashboard" onclick="setTab('dashboard')"><span class="ic">🏠</span><span class="lb">Dashboard</span></button>
  <button class="navbtn" data-tab="itinerary" onclick="setTab('itinerary')"><span class="ic">🗓️</span><span class="lb">Itinerary</span></button>
  <button class="navbtn" data-tab="expenses" onclick="setTab('expenses')"><span class="ic">💰</span><span class="lb">Expenses</span></button>
  <button class="navbtn" data-tab="bookings" onclick="setTab('bookings')"><span class="ic">🎟️</span><span class="lb">Bookings</span></button>
  <button class="navbtn" data-tab="checklists" onclick="setTab('checklists')"><span class="ic">☑️</span><span class="lb">Checklists</span></button>
  <button class="navbtn" data-tab="more" onclick="setTab('more')"><span class="ic">⚙️</span><span class="lb">More</span></button>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

let storageOK = true;       // whether localStorage actually works in this environment
let lastSaveFailed = false; // whether the most recent write attempt failed
function storageAvailable(){
  try{
    const t = '__mtp_test__';
    localStorage.setItem(t,'1');
    const back = localStorage.getItem(t);
    localStorage.removeItem(t);
    return back === '1';
  }catch(e){ return false; }
}
function setSaveStatus(kind){
  const el = document.getElementById('save-status');
  if(!el) return;
  el.classList.remove('saving','error');
  if(kind==='saving'){ el.textContent='Saving…'; el.classList.add('saving'); }
  else if(kind==='error'){ el.textContent='⚠️ Not saved'; el.classList.add('error'); }
  else { el.textContent='✓ Saved'; }
}
async function loadState(){
  storageOK = storageAvailable();
  if(storageOK){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ state = JSON.parse(raw); return; }
    }catch(e){
      // stored value exists but is corrupt/unreadable — don't silently discard it, keep it recoverable
      console.error('stored data unreadable', e);
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw) localStorage.setItem(STORAGE_KEY+'-recovery-'+Date.now(), raw);
      }catch(e2){/* ignore */}
    }
  }
  state = realTripData();
  await saveState();
}
let saveTimer=null;
async function saveState(){
  clearTimeout(saveTimer);
  setSaveStatus('saving');
  return new Promise(resolve=>{
    saveTimer = setTimeout(()=>{
      try{
        if(!storageOK) throw new Error('storage unavailable in this environment');
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        lastSaveFailed = false;
        setSaveStatus('ok');
      }catch(e){
        console.error('save failed', e);
        lastSaveFailed = true;
        setSaveStatus('error');
        showToast('⚠️ Not saved — tap "⚠️ Not saved" up top for why');
      }
      resolve();
    }, 150);
  });
}
function showStorageInfo(){
  if(storageOK && !lastSaveFailed){
    showSheet('💾 Storage status', `
      <div class="hint">Your data is saving normally to this browser's local storage on this device. Nothing is sent anywhere else.</div>
      <div class="hint" style="margin-top:10px;">Still worth backing up occasionally — use More → Backup & Data → Export.</div>
    `);
    return;
  }
  showSheet('⚠️ Changes are not being saved', `
    <div class="hint" style="margin-bottom:10px;"><b>What's happening:</b> this browser/view is blocking local storage, so your edits only exist in memory right now — closing or reloading this page will lose them.</div>
    <div class="hint" style="margin-bottom:10px;"><b>The most common cause:</b> viewing this file inside a preview window (like Claude's in-chat file preview, an email attachment preview, or the iOS Files app "Quick Look" preview) instead of opening it as its own page. Those previews often run the page in a locked-down mode with no storage access, even though the app itself works correctly.</div>
    <div class="hint" style="margin-bottom:10px;"><b>The fix:</b> download <span class="mono">Melbourne_Trip_Planner.html</span> to your device, then open that saved file directly in Safari or Chrome (not through a preview/QuickLook screen). On iPhone: Files app → tap the file once to preview → Share icon → "Open in Safari" (or long-press → Open In).</div>
    <div class="hint"><b>In the meantime:</b> avoid losing work — use More → Backup & Data → Export to download a JSON copy before you close this tab, then Import it once you're in a properly opened copy.</div>
  `);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

/* =========================================================
   HELPERS
   ========================================================= */
function fmtMoney(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString(undefined,{minimumFractionDigits: n%1?2:0, maximumFractionDigits:2});
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
}
function todayStr(){
  const t = new Date();
  return t.toISOString().slice(0,10);
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const t = new Date(todayStr()+'T00:00:00');
  const d = new Date(dateStr+'T00:00:00');
  return Math.round((d-t)/86400000);
}
function priorityTag(p){
  const map = {must:['tag-must','🔴 Must Do'], high:['tag-high','🟠 High'], opt:['tag-opt','🟡 Optional'], if:['tag-if','⚪ If Time']};
  const v = map[p] || map.opt;
  return `<span class="tag ${v[0]}">${v[1]}</span>`;
}
function statusTag(s){
  const map = {confirmed:['tag-conf','✅ Confirmed'], pending:['tag-pending','🟡 Pending'], cancelled:['tag-cancel','❌ Cancelled'], action:['tag-action','⚠️ Action']};
  const v = map[s] || map.pending;
  return `<span class="tag ${v[0]}">${v[1]}</span>`;
}
function categoryIcon(c){
  const m = {Flights:'✈️',Hotels:'🏨','Rental Car':'🚗',Petrol:'⛽',Parking:'🅿️',Toll:'🛣️','Public Transport':'🚋','Uber/Taxi':'🚕',Food:'🍜','Café':'☕',Groceries:'🛒',Attractions:'🎟️',Entertainment:'🎭',Shopping:'🛍️',Fees:'💳',Other:'🧳'};
  return m[c] || '🧳';
}
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function copyText(txt){
  navigator.clipboard?.writeText(txt).then(()=>showToast('Copied ✓')).catch(()=>showToast('Could not copy'));
}

function tripStatusLabel(){
  const {startDate,endDate} = state.trip;
  if(!startDate||!endDate) return {big:'—', sub:'Add your trip dates to start the countdown'};
  const du = daysUntil(startDate);
  const dEnd = daysUntil(endDate);
  if(du>0) return {big:`${du} day${du===1?'':'s'}`, sub:'until Melbourne ✈️'};
  if(du<=0 && dEnd>=0){
    const totalDays = Math.round((new Date(endDate)-new Date(startDate))/86400000)+1;
    const dayN = totalDays - dEnd;
    return {big:`Day ${dayN} of ${totalDays}`, sub:'Enjoy Melbourne!'};
  }
  return {big:'Trip completed 🎉', sub:'Hope Melbourne was great'};
}
function totalExpenses(confirmedOnly){
  return state.expenses.filter(e=> confirmedOnly ? e.confirmed!==false : true).reduce((s,e)=>s+(Number(e.amount)||0),0);
}
function nextItineraryItem(){
  const today = todayStr();
  let best=null;
  for(const day of state.itineraryDays){
    if(day.date < today) continue;
    for(const item of day.items){
      if(day.date===today){
        // only future times today, roughly
      }
      if(!best || day.date<best.day.date || (day.date===best.day.date && item.time<best.item.time)){
        best = {day, item};
      }
    }
  }
  return best;
}

function countOutstandingTasks(){

  for(const sec in state.checklists){ n += state.checklists[sec].filter(i=>!i.done).length; }

}

function renderPacking(){
  const cats = Object.keys(state.packing);
  if(!packingCategory || !cats.includes(packingCategory)) packingCategory = cats[0];
  const allItems = Object.values(state.packing).flat();
  const packed = allItems.filter(i=>i.packed).length;
  const items = state.packing[packingCategory] || [];
  return `
  <div class="sec-head"><h2>🧳 Packing List</h2><span class="link" style="font-size:12.5px;color:var(--rust);font-weight:600;cursor:pointer;" onclick="setTab('more')">More</span></div>
  <div class="card">
    <div class="card-title">Overall progress</div>
    <div class="display" style="font-size:20px;font-weight:600;">${packed} / ${allItems.length} packed</div>
    <div class="progress"><div style="width:${allItems.length?Math.round(packed/allItems.length*100):0}%"></div></div>
  </div>
  <div class="segmented">${cats.map(c=>`<button class="seg-btn ${packingCategory===c?'active':''}" onclick="setPackingCategory('${c}')">${c}</button>`).join('')}</div>
  <div class="card">
    <div class="card-title">${packingCategory}</div>
    ${items.length ? items.map(i=>`
      <div class="checkrow">
        <div class="checkbox ${i.packed?'done':''}" onclick="togglePacked('${packingCategory}','${i.id}')">${i.packed?'✓':''}</div>
        <div class="checkrow-text ${i.packed?'done':''}">${esc(i.text)}</div>
        <div class="del-x" onclick="deletePackItem('${packingCategory}','${i.id}')">✕</div>
      </div>
    `).join('') : `<div class="hint">No items yet.</div>`}
    <div style="margin-top:12px;display:flex;gap:8px;">
      <input id="new-pack-item" placeholder="Add item…" style="flex:1;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);">
      <button class="btn btn-rust btn-sm" onclick="addPackItem()">Add</button>
    </div>
  </div>
  `;
}
function setPackingCategory(c){ packingCategory=c; render(); }
async function togglePacked(cat,id){
  const item = state.packing[cat].find(i=>i.id===id);
  item.packed = !item.packed;
  await saveState(); render();
}
async function deletePackItem(cat,id){
  state.packing[cat] = state.packing[cat].filter(i=>i.id!==id);
  await saveState(); render();
}
async function addPackItem(){
  const text = val('new-pack-item');
  if(!text) return;
  state.packing[packingCategory].push({id:uid(), text, packed:false});
  await saveState(); render();
}

    <div class="field"><label>Date</label><input type="date" id="f-date" value="${n.date||todayStr()}"></div>
    <div class="field"><label>Content</label><textarea id="f-content" style="min-height:100px;">${esc(n.content||'')}</textarea></div>
    <button class="btn btn-primary" onclick="saveNote('${id||''}')">Save note</button>
  `);
}
async function saveNote(id){
  const data = { title:val('f-title'), category:val('f-category'), date:val('f-date'), content:val('f-content') };
  if(id){ Object.assign(state.notes.find(n=>n.id===id), data); }
  else { state.notes.push({id:uid(), ...data}); }
  await saveState(); closeSheet(); setTab('notes'); showToast('Saved ✓');
}
async function deleteNote(id){
  if(!confirm('Delete this note?')) return;
  state.notes = state.notes.filter(n=>n.id!==id);
  await saveState(); render();
}

/* =========================================================
   IMPORT / EXPORT
   ========================================================= */
function downloadFile(filename, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function exportJSON(){
  downloadFile('melbourne-trip-data.json', JSON.stringify(state, null, 2), 'application/json');
  showToast('Exported ✓');
}
let pendingImport = null;
function importJSON(evt){
  const file = evt.target.files[0];
  evt.target.value = ''; // allow re-selecting the same file later
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ alert('Could not read that file — please check it is a valid Melbourne Trip Planner backup.'); return; }
    if(!data || typeof data!=='object' || !('trip' in data)){
      alert('That file doesn\'t look like a Melbourne Trip Planner backup.'); return;
    }
    pendingImport = data;
    showSheet('Import backup', `
      <div class="hint" style="margin-bottom:14px;">Importing a backup may replace or merge with your existing trip data. Choose how to apply it:</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-primary btn-block" onclick="applyImport('replace')">Replace existing data</button>
        <button class="btn btn-ghost btn-block" onclick="applyImport('merge')">Merge with existing data</button>
        <button class="btn btn-ghost btn-block" onclick="closeSheet()">Cancel</button>
      </div>
      <div class="hint" style="margin-top:12px;">Replace overwrites everything currently in the app with the backup. Merge adds the backup's hotels, flights, bookings, expenses, itinerary days, checklist/packing items and notes alongside what's already here (trip name/dates/budget are only updated if yours are currently blank).</div>
    `);
  };
  reader.readAsText(file);
}
async function applyImport(mode){
  if(!pendingImport) return;
  const data = pendingImport;
  if(mode==='replace'){
    state = data;
  } else {
    // merge: append array-based records, fill in blank trip fields, merge checklist/packing sections by name
    state.flights.push(...(data.flights||[]));
    state.hotels.push(...(data.hotels||[]));
    state.bookings.push(...(data.bookings||[]));
    state.expenses.push(...(data.expenses||[]));
    state.notes.push(...(data.notes||[]));
    state.itineraryDays.push(...(data.itineraryDays||[]));
    if((!state.rentalCar || !state.rentalCar.company) && data.rentalCar) state.rentalCar = data.rentalCar;
    for(const k in (data.trip||{})){ if(!state.trip[k]) state.trip[k] = data.trip[k]; }
    for(const sec in (data.checklists||{})){
      if(!state.checklists[sec]) state.checklists[sec] = [];
      state.checklists[sec].push(...data.checklists[sec]);
    }
    for(const cat in (data.packing||{})){
      if(!state.packing[cat]) state.packing[cat] = [];
      state.packing[cat].push(...data.packing[cat]);
    }
  }
  pendingImport = null;
  await saveState(); closeSheet(); setTab('more'); showToast(mode==='replace' ? 'Backup restored ✓' : 'Backup merged ✓');
}
async function resetTripData(){
  if(!confirm('Are you sure you want to permanently delete all trip data? This cannot be undone.')) return;
  if(!confirm('Really delete everything — itinerary, hotels, bookings, expenses, checklists, packing, and notes? Consider exporting a backup first.')) return;
  state = emptyData();
  await saveState(); render(); showToast('Trip data reset');
}

/* =========================================================
   SEARCH

function openSearch(){
  showSheet('⌕ Search', `
    <input id="search-input" placeholder="Search bookings, hotels, expenses, notes…" style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;" oninput="runSearch()">
    <div id="search-results" style="margin-top:14px;"></div>
  `);
  setTimeout(()=>document.getElementById('search-input')?.focus(), 50);
}
function runSearch(){
  const q = val('search-input').trim().toLowerCase();
  const results = [];
  if(q.length>=1){
    state.hotels.forEach(h=>{ if(matchAny(h,['name','address','bookingRef'],q)) results.push({ic:'🏨',label:h.name,sub:h.bookingRef||h.address,go:()=>{closeSheet();setTab('hotels');}}); });
    state.flights.forEach(f=>{ if(matchAny(f,['airline','flightNo','bookingRef'],q)) results.push({ic:'✈️',label:`${f.airline||''} ${f.flightNo||''}`,sub:f.bookingRef,go:()=>{closeSheet();setTab('flights');}}); });
    if(state.rentalCar && matchAny(state.rentalCar,['company','vehicle','bookingRef'],q)) results.push({ic:'🚗',label:state.rentalCar.company,sub:state.rentalCar.bookingRef,go:()=>{closeSheet();setTab('car');}});
    state.bookings.forEach(b=>{ if(matchAny(b,['name','bookingNo','confNo','location'],q)) results.push({ic:'🎟️',label:b.name,sub:b.bookingNo,go:()=>{closeSheet();setTab('bookings');}}); });
    state.expenses.forEach(e=>{ if(matchAny(e,['description','category','location'],q)) results.push({ic:'💰',label:e.description||e.category,sub:fmtMoney(e.amount),go:()=>{closeSheet();setTab('expenses');}}); });
    state.notes.forEach(n=>{ if(matchAny(n,['title','content'],q)) results.push({ic:'📝',label:n.title,sub:n.category,go:()=>{closeSheet();setTab('notes');}}); });
    state.itineraryDays.forEach(d=>{ d.items.forEach(i=>{ if(matchAny(i,['activity','location','address'],q)) results.push({ic:'🗓️',label:i.activity,sub:fmtDate(d.date),go:()=>{closeSheet();openDayId=d.id;setTab('itinerary');}}); }); });
  }
  const el = document.getElementById('search-results');
  if(!q) { el.innerHTML=''; return; }
  el.innerHTML = results.length ? results.map((r,idx)=>`
    <div class="row" style="cursor:pointer;" onclick="searchResultClick(${idx})"><div class="row-main"><div class="row-title">${r.ic} ${esc(r.label||'')}</div><div class="row-sub">${esc(r.sub||'')}</div></div></div>
  `).join('') : `<div class="hint">No matches.</div>`;
  window._searchResults = results;
}
function searchResultClick(idx){ window._searchResults[idx].go(); }
function matchAny(obj, fields, q){
  return fields.some(f=> (obj[f]||'').toString().toLowerCase().includes(q));
}

function quickPick(kind){
  if(kind==='itinerary'){
    if(!state.itineraryDays.length){ setTab('itinerary'); openAddDay(); return; }
    setTab('itinerary');
    const sorted = state.itineraryDays.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    const today = todayStr();
    const target = sorted.find(d=>d.date>=today) || sorted[0];
    openDayId = target.id; render();
    openAddItem(target.id);
  } else if(kind==='checklist'){ setTab('checklists'); }
  else if(kind==='packing'){ setTab('packing'); }
}

   MODAL / SHEET UTIL

function showSheet(title, bodyHtml){
  document.getElementById('sheet').innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h3>${title}</h3><button class="sheet-close" onclick="closeSheet()">✕</button></div>
    ${bodyHtml}
  `;
  document.getElementById('overlay').classList.add('show');
}
function closeSheet(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeSheet(); });
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }

(async function init(){
  await loadState();
  render();
})();
